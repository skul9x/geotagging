name: Build APK and Create GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/debug/app-debug.apk release_output/geotagging-v1.4.apk
          ls -la release_output/

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4
          name: Release v1.4
          body: |
            ## 🚀 Automated Release v1.4

            Bản phát hành tự động được đóng gói bởi GitHub Actions CI/CD.

            ### 📦 Thông tin bản build:
            - **Tên ứng dụng:** Batch Geotagging & File Range Manager
            - **Tệp đính kèm:** `geotagging-v1.4.apk`
            - **Loại build:** Debug APK
          files: release_output/geotagging-v1.4.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
